<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | TuxBlox Docs</title>


    <!-- THEME BOOT. Must be inline and blocking, before first paint.
         include.js is deferred and cross-origin, so it runs too late to set
         the theme without a visible flash. Keep in sync across pages. -->
    <script>
    (function () {
        var KEY = 'tuxblox_theme', t;
        try { t = localStorage.getItem(KEY); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.add('theme-init');
    })();
    </script>
    <meta name="description" content="TuxBlox is an open-source launcher and compatibility layer that runs the official Roblox Client and Studio natively on Linux.">
    <link rel="canonical" href="https://tuxblox.net">

    <link rel="icon" type="image/x-icon" href="https://tuxblox.net/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/icon/tuxblox-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/style.css?v=20260904">
    <link rel="stylesheet" href="/static/styles/docs.css?v=20260904">

    <meta property="og:title" content="{{TITLE}} | TuxBlox Docs 🐧" />
    <meta property="og:site_name" content="tuxblox.net" />
    <meta property="og:description" content="An open-source project that allows Roblox to run on Linux through a custom compatibility layer" />
    <meta property="og:image" content="https://tuxblox.net/static/images/icon/tuxblox-icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

</head>
