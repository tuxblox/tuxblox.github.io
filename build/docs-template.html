<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | TuxBlox Docs</title>


    <!-- THEME BOOT. Must be inline and blocking, before first paint.
         include.js is deferred and cross-origin, so it runs too late to set
         the theme without a visible flash. Keep in sync across pages. -->
    <script>
    (function () {
        var KEY = 'tuxblox_theme', t;
        try { t = localStorage.getItem(KEY); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.add('theme-init');
    })();
    </script>
    <meta name="description" content="TuxBlox is an open-source launcher and compatibility layer that runs the official Roblox Client and Studio natively on Linux.">
    <link rel="canonical" href="https://tuxblox.net">

    <link rel="icon" type="image/x-icon" href="https://tuxblox.net/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/icon/tuxblox-icon.png">

    <link rel="stylesheet" href="/static/styles/style.css?v=20261016">
    <link rel="stylesheet" href="/static/styles/docs.css?v=20261017">

    <!-- NO-SCRIPT NAVIGATION. The topbar is injected at runtime by include.js,
         so without scripting this sidebar is the only navigation on the page.
         The drawer cannot open without its button handler, so the rail goes
         back to being a plain block above the article at every width. -->
    <noscript>
        <style>
            .docs-drawer-toggle { display: none !important; }
            .docs-rail {
                position: static !important;
                width: auto !important;
                height: auto !important;
                max-height: none !important;
                transform: none !important;
                visibility: visible !important;
                border-right: none !important;
                border-bottom: 1px solid var(--divider);
                margin-bottom: 24px;
            }
            .container.docs-page { padding-left: 40px !important; }
            .docs-rail-backdrop { display: none !important; }
        </style>
    </noscript>

    <meta property="og:title" content="{{TITLE}} | TuxBlox Docs 🐧" />
    <meta property="og:site_name" content="tuxblox.net" />
    <meta property="og:description" content="An open-source project that allows Roblox to run on Linux through a custom compatibility layer" />
    <meta property="og:image" content="https://tuxblox.net/static/images/icon/tuxblox-icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tuxblox.net" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TuxBlox 🐧" />
    <meta name="twitter:description" content="Roblox on Linux. Fast. Simple." />
    <meta name="twitter:image" content="https://tuxblox.net/static/images/icon/tuxblox-icon.png" />

    <meta name="theme-color" content="#0e1117" />
</head>
<body>

    <div class="container docs-page">
        <div data-include="topbar"></div>

        <button type="button" id="docs-drawer-toggle" class="docs-drawer-toggle" aria-expanded="false" aria-controls="docs-rail">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            <span>Documentation</span>
        </button>

        <nav id="docs-rail" class="docs-rail" aria-label="Documentation">
            {{SIDEBAR}}
        </nav>
        <div class="docs-rail-backdrop" hidden></div>

        <div class="docs-layout">
            <main class="docs-content">
                <article>
                    {{CONTENT}}
                </article>
                {{DOCNAV}}
            </main>
            <aside class="docs-aside">{{TOC}}</aside>
        </div>

        <!--div data-include="footer"></div-->
    </div>

    <script src="/static/scripts/include.js?v=20261016" defer></script>
    <script src="/static/scripts/docs-nav.js?v=20261017" defer></script>
</body>
</html>
